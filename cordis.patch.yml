# dsh-plugin-sql-runner — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "sqlrun".
# Tools resultantes: mcp__sqlrun__* (ver README).
- insert:
    - id: mcp-sql-runner
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: sqlrun
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/sql-runner/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
